:root{--black:#262626;--lime:#d3ff5f;--blue:#498bff;--lb:#f4f6ff;--pink:#ef5da8;--orange:#ff763d;--edge:#d5dbef;
  --u:min(1.1vw,1.5vh)}
@media (max-aspect-ratio:5/4){:root{--u:min(1.1vw,.95vh)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--black);font-family:"Basis",Inter,system-ui,sans-serif;font-weight:500;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.big{font-family:"TTC","Outfit",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:.95}
.screen{position:absolute;inset:0;display:none;padding:calc(var(--u)*2)}
.screen.show{display:flex}

/* choose screens */
.choose{flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3)}
.choose h1{margin:0;font-size:calc(var(--u)*6);text-align:center}
.tiles{display:flex;gap:calc(var(--u)*3);justify-content:center;width:100%}
.tile{flex:0 1 calc(var(--u)*34);background:var(--lb);border-radius:calc(var(--u)*4);padding:calc(var(--u)*3) calc(var(--u)*2);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.5);transition:background-color .3s;border:calc(var(--u)*.6) solid transparent}
.tile:hover,.tile:focus-visible{background:var(--lime);border-color:var(--black);outline:none}
.tile svg{width:calc(var(--u)*20);height:calc(var(--u)*16)}
.tile .big{font-size:calc(var(--u)*5)}
.stars{display:flex;gap:calc(var(--u)*.6);min-height:calc(var(--u)*2.4)}
.stars i{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);background:var(--edge);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:var(--orange)}
.corner{position:absolute;left:calc(var(--u)*2);top:calc(var(--u)*2);display:flex;gap:calc(var(--u)*1)}
.round{width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;background:var(--lb);display:inline-flex;align-items:center;justify-content:center;transition:background-color .3s}
.round:hover{background:var(--lime)}
.round svg{width:55%;height:55%}

/* lesson */
.lesson{flex-direction:column;gap:calc(var(--u)*1.2)}
.head{display:flex;align-items:center;gap:calc(var(--u)*2)}
.cap{flex:1;font-size:calc(var(--u)*6);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:calc(var(--u)*.8)}
.dots i{width:calc(var(--u)*1.8);height:calc(var(--u)*1.8);border-radius:50%;background:var(--edge)}
.dots i.cur{background:var(--black)}
.dots i.done{background:var(--lime);box-shadow:inset 0 0 0 calc(var(--u)*.4) var(--black)}
.main{flex:1;min-height:0;position:relative;background:var(--lb);border-radius:calc(var(--u)*4);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*10)}
@media (max-aspect-ratio:5/4){.main{flex-direction:column;gap:calc(var(--u)*2)}}
.visual,.practice{display:flex;align-items:center;justify-content:center;min-width:0}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;background:var(--black);display:flex;align-items:center;justify-content:center;transition:background-color .3s;z-index:3}
.arrow svg{width:50%;height:50%}
.arrow.prev{left:calc(var(--u)*1)}
.arrow.next{right:calc(var(--u)*1)}
.arrow:hover{background:var(--blue)}
.arrow.glow{animation:glow 1s infinite}
@keyframes glow{50%{background:var(--lime)}}
.arrow.glow path{stroke:#fff}

/* big keys */
.keys{display:flex;align-items:center;gap:calc(var(--u)*2);padding-top:calc(var(--u)*4)}
.plus{font-family:"TTC";font-size:calc(var(--u)*7);line-height:1}
.bk{position:relative;width:var(--kz,calc(var(--u)*15));height:var(--kz,calc(var(--u)*15));border-radius:calc(var(--u)*2.4);background:#fff;border:calc(var(--u)*.5) solid var(--black);border-bottom-width:calc(var(--u)*1.4);display:flex;flex-direction:column;align-items:center;justify-content:center}
.bk.wide{width:calc(var(--u)*36)}
.bk.mid{width:calc(var(--u)*20)}
.bk .l{font-family:"TTC";font-size:calc(var(--u)*7.5);line-height:1}
.bk .l.sm{font-size:calc(var(--u)*5)}
.bk .s{font-size:calc(var(--u)*2.4)}
.bk .c{position:absolute;right:calc(var(--u)*1.2);bottom:calc(var(--u)*.8);font-size:calc(var(--u)*2.6);color:#7a8099}
.badge{position:absolute;bottom:calc(100% + var(--u)*1.2);left:50%;transform:translateX(-50%);background:var(--black);color:#fff;border-radius:calc(var(--u)*3);padding:calc(var(--u)*.6) calc(var(--u)*1.4);display:flex;align-items:center;gap:calc(var(--u)*.6);white-space:nowrap;font-size:calc(var(--u)*2.2)}
.badge svg{width:calc(var(--u)*2.6);height:calc(var(--u)*2.6)}
.badge.n{background:var(--pink)}
.finger{position:absolute;left:50%;top:calc(var(--u)*-1);width:calc(var(--u)*6);height:calc(var(--u)*6);margin-left:calc(var(--u)*-3);border-radius:50%;background:rgba(239,93,168,.5);border:calc(var(--u)*.5) solid var(--pink);opacity:0;pointer-events:none}
.bk.hold{animation:kHold 3s infinite}.bk.hold .finger{animation:fHold 3s infinite}
.bk.tap2{animation:kTap2 3s infinite}.bk.tap2 .finger{animation:fTap2 3s infinite}
.bk.tap{animation:kTap 1.6s infinite}.bk.tap .finger{animation:fTap 1.6s infinite}
@keyframes kHold{0%,12%{background:#fff;transform:none}16%,78%{background:var(--lime);transform:translateY(calc(var(--u)*.8))}84%,100%{background:#fff;transform:none}}
@keyframes fHold{0%{opacity:0;transform:translateY(calc(var(--u)*-7))}12%,78%{opacity:1;transform:none}86%,100%{opacity:0;transform:translateY(calc(var(--u)*-7))}}
@keyframes kTap2{0%,40%{background:#fff;transform:none}44%,58%{background:var(--lime);transform:translateY(calc(var(--u)*.8))}62%,100%{background:#fff;transform:none}}
@keyframes fTap2{0%,30%{opacity:0;transform:translateY(calc(var(--u)*-7))}40%,58%{opacity:1;transform:none}68%,100%{opacity:0;transform:translateY(calc(var(--u)*-7))}}
@keyframes kTap{0%,30%{background:#fff;transform:none}36%,55%{background:var(--lime);transform:translateY(calc(var(--u)*.8))}62%,100%{background:#fff;transform:none}}
@keyframes fTap{0%,15%{opacity:0;transform:translateY(calc(var(--u)*-7))}32%,55%{opacity:1;transform:none}70%,100%{opacity:0;transform:translateY(calc(var(--u)*-7))}}
.bk.real{background:#9fc0ff!important;animation:none!important}
.bk.real .finger{animation:none;opacity:0}
.wasd{display:grid;grid-template-columns:repeat(3,auto);gap:calc(var(--u)*1);padding-top:calc(var(--u)*3)}
.wasd .bk{--kz:calc(var(--u)*10)}
.wasd .bk .l{font-size:calc(var(--u)*5.5)}
.wasd .e{visibility:hidden}
.mouse{width:calc(var(--u)*16);height:auto}
.mouse .body,.mouse .bl,.mouse .br{fill:#fff;stroke:var(--black);stroke-width:4}
.mouse .wh{fill:var(--edge)}
.mouse.L .bl,.mouse.R .br{animation:mclick 1.6s infinite}
@keyframes mclick{0%,30%{fill:#fff}36%,60%{fill:var(--lime)}66%,100%{fill:#fff}}

/* practice */
.cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:calc(var(--u)*3.3);background:#fff;border-radius:calc(var(--u)*2);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);border:calc(var(--u)*.4) dashed var(--edge);position:relative;white-space:nowrap}
.cmd .sweep{position:absolute;left:calc(var(--u)*2.2);top:calc(var(--u)*1.2);bottom:calc(var(--u)*1.2);background:rgba(73,139,255,.35);border-radius:6px;animation:sweep 2.4s infinite;width:0;pointer-events:none}
@keyframes sweep{0%,10%{width:0}70%,90%{width:calc(100% - var(--u)*4.4)}100%{width:0}}
.box{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:calc(var(--u)*3.6);width:calc(var(--u)*40);max-width:100%;border-radius:calc(var(--u)*5);border:calc(var(--u)*.5) solid var(--black);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);outline:none;background:#fff;text-align:center}
.box:focus{border-color:var(--blue)}
.box.pulse{animation:boxpulse 1.4s infinite}
@keyframes boxpulse{50%{border-color:var(--pink);background:#fff0f7}}
.wins{display:flex;gap:calc(var(--u)*1.6)}
.win{width:calc(var(--u)*16);border-radius:calc(var(--u)*2);border:calc(var(--u)*.5) solid transparent;background:#fff;padding:calc(var(--u)*1)}
.win .scr{height:calc(var(--u)*9);border-radius:calc(var(--u)*1)}
.win.on{border-color:var(--black)}
.win.game .scr{background:linear-gradient(#8fd3ff 50%,#6ab04c 50%)}
.win.les .scr{background:#fff;border:calc(var(--u)*.3) solid var(--edge);position:relative}
.win.les .scr::after{content:"";position:absolute;left:12%;right:12%;top:18%;height:14%;border-radius:6px;background:var(--lime);box-shadow:0 calc(var(--u)*2.4) 0 #dfe4f5,0 calc(var(--u)*4.8) 0 #dfe4f5}

  const m=MOD(),a=ALT(); let spec=KEY[code];
  if(code===m.code||code===a.code){const x=code===m.code?m:a; spec={big:x.big,small:x.small,sm:x.big.length>1};}
  const d=document.createElement("div"); d.className="bk "+anim+(spec.wide?" wide":"")+((spec.sm||spec.small)?" mid":""); d.dataset.code=code;
  d.innerHTML=(badge||"")+'<div class="finger"></div>'+(spec.big?'<div class="l'+(spec.sm?" sm":"")+'">'+spec.big+'</div>':'')+(spec.small?'<div class="s">'+spec.small+'</div>':'')+(LANG==="ru"&&spec.c?'<div class="c">'+spec.c+'</div>':'')+(LANG==="ar"&&AR[code]?'<div class="c">'+AR[code]+'</div>':'');
  return d;
}
function mouseSVG(cls){return '<svg class="mouse '+cls+'" viewBox="0 0 80 120"><path class="body" d="M6 50 L74 50 L74 80 A34 34 0 0 1 6 80 Z"/><path class="bl" d="M6 46 L6 36 A34 34 0 0 1 38 4 L38 46 Z"/><path class="br" d="M42 4 A34 34 0 0 1 74 36 L74 46 L42 46 Z"/><rect class="wh" x="35" y="14" width="10" height="22" rx="5"/></svg>';}

/* screens */
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("show",s.id===id));
  const slot={scrOS:"langSlotOS",scrTopics:"langSlotTopics",scrLesson:"langSlotLesson"}[id]; if(slot) $(slot).appendChild($("langBtn")); }
function setLang(l){ LANG=l; TX=LANGS[l]; document.documentElement.lang=l; try{localStorage.setItem("kbLang",l);}catch(e){}
  $("langName").textContent=TX.name;
  $("langList").innerHTML=ORDER.map(k=>'<button data-l="'+k+'" class="'+(k===LANG?"on":"")+'"'+(LANGS[k].rtl?' dir="rtl"':'')+'>'+LANGS[k].name+'</button>').join("");
  if(SC>=0){pk="";render();} else if($("scrTopics").classList.contains("show")) topics(); }
function cur(){ return SC<0?null:steps(SC)[ST]; }
function topics(){
  SC=-1; show("scrTopics");
  $("topics").innerHTML=[TX.tiles[0],TX.tiles[2]].map((n,i)=>{const s=steps(i).length,d=Object.keys(ever).filter(k=>k.startsWith(i+"-")).length;
    return '<button class="tile" data-i="'+i+'">'+[ICON[0],ICON[2]][i]+'<div class="big">'+n+'</div><div class="stars">'+Array.from({length:s},(_,j)=>'<i class="'+(j<d?"on":"")+'"></i>').join("")+'</div></button>';}).join("");
}
function render(){
  delete done[SC+"-"+ST];
  const all=steps(SC), st=all[ST]; show("scrLesson");
  $("dots").innerHTML=all.map((_,i)=>'<i class="'+(i===ST?"cur ":"")+(ever[SC+"-"+i]?"done":"")+'"></i>').join("");
  $("cap").textContent=st.cap; if(TX.rtl) $("cap").setAttribute("dir","rtl"); else $("cap").removeAttribute("dir");
  const v=$("visual"); v.innerHTML="";
  const holdBadge='<div class="badge">'+HAND+TX.hold+'</div>';
  if(st.combo){ const w=document.createElement("div"); w.className="keys"; w.appendChild(bigKey(st.combo[0],"hold",holdBadge)); const p=document.createElement("div");p.className="plus";p.textContent="+";w.appendChild(p); w.appendChild(bigKey(st.combo[1],"tap2")); v.appendChild(w); }
  if(st.tap){ const w=document.createElement("div"); w.className="keys"; st.tap.forEach(c=>w.appendChild(bigKey(c,"tap"))); v.appendChild(w); }
  if(st.wasd){ const w=document.createElement("div"); w.className="wasd";
    ["","KeyW","","KeyA","KeyS","KeyD"].forEach(c=>{ if(!c){const e=document.createElement("div");e.className="bk e";w.appendChild(e);} else {const k=bigKey(c,"tap"); const dl=(["KeyW","KeyA","KeyS","KeyD"].indexOf(c)*.4)+"s"; k.style.animationDelay=dl; k.querySelector(".finger").style.animationDelay=dl; w.appendChild(k);} });
    v.appendChild(w); }
  if(st.mouse) v.innerHTML=mouseSVG(st.mouse);
  renderPractice(st.prac);
  if(SC===1&&ST===0&&S) S.used.clear();
  if(SC===0) resetCopy();
  if(SC===1) drawScene();
  if(st.demo){ done[SC+"-"+ST]=true; ever[SC+"-"+ST]=true; }
  $("next").classList.toggle("glow",!!done[SC+"-"+ST]);
  $("okb").classList.remove("show");
  paintMap();
}
let pk="";
function renderPractice(kind){
  const p=$("practice");
  if(kind===pk){ const sw=document.querySelector("#cmd .sweep"); if(sw&&ST!==0) sw.remove(); return; }
  pk=kind;
  if(kind==="select"){ p.innerHTML='<div class="cmd" id="cmd">'+(ST===0?'<span class="sweep"></span>':'')+CMD+'</div>';
    $("cmd").addEventListener("mousedown",()=>{ try{ document.getSelection().removeAllRanges(); }catch(e){} }); }
  else if(kind==="box"){ p.innerHTML='<input class="box pulse" id="box" autocomplete="off" spellcheck="false">'; const b=$("box");
    b.addEventListener("mousedown",()=>{ b.classList.remove("pulse"); if(SC===0&&ST===2) win(); });
    b.addEventListener("input",()=>{ if(b.value.trim()&&ST===3) win(); }); }
  else if(kind==="wins"||kind==="winsAnim") p.innerHTML='<div class="wins'+(kind==="winsAnim"?" anim":"")+'" id="wins"><div class="win game"><div class="scr"></div></div><div class="win les on"><div class="scr"></div></div></div>';
  else if(kind==="scene"){ p.innerHTML='<div class="mc" id="mc"><div class="world" id="world"><canvas class="map" id="mapc" width="192" height="96"></canvas><div class="sel" id="sel"></div><div class="hero" id="hero"><div class="sh"></div><canvas id="heroc" width="8" height="14"></canvas></div><div class="inv" id="inv"></div><div class="log" id="log"></div><div class="chat" id="chat"></div></div><div class="bar" id="bar"></div></div>'; initScene(); }
  else p.innerHTML="";
}

/* success */
function resetCopy(){
  try{ const sel=document.getSelection(); if(ST===0||ST===2) sel.removeAllRanges(); }catch(e){}
  const b=$("box"); if(b){ b.value=""; if(ST===2){ b.blur(); b.classList.add("pulse"); } }
}
function win(){
  const key=SC+"-"+ST; if(done[key]) return; done[key]=true; ever[key]=true;
  const b=$("okb"); b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); ding();
  const d=document.querySelectorAll("#dots i")[ST]; if(d) d.classList.add("done");
  $("next").classList.add("glow");
  setTimeout(()=>{ b.classList.remove("show"); if(SC>=0 && key===SC+"-"+ST) next(); },1200);
}
function next(){ if(SC===1&&ST===5&&$("chat")){ /* chat stays open for the Esc step */ } const n=steps(SC).length; if(ST<n-1){ST++;render();} else topics(); }

/* scene: a small top-down Minecraft world */
const COLS=12, ROWS=6;
function rng(seed){ let x=seed%2147483647; if(x<=0)x+=2147483646; return ()=>((x=x*16807%2147483647)-1)/2147483646; }
function texture(kind,seed){
  const c=document.createElement("canvas"); c.width=c.height=16; const g=c.getContext("2d"); const r=rng(seed||7);
  const px=(x,y,col)=>{g.fillStyle=col;g.fillRect(x,y,1,1);};
  const pick=a=>a[Math.floor(r()*a.length)];
  if(kind==="grass"||kind==="flower"){ for(let y=0;y<16;y++)for(let x=0;x<16;x++)px(x,y,pick(["#5b9c35","#64a83c","#538f30","#6fb446","#5b9c35","#4c8529"]));
    if(kind==="flower"){ const fx=3+Math.floor(r()*9), fy=3+Math.floor(r()*9), pc=r()<.5?"#e8342c":"#f2d22e"; [[0,-1],[-1,0],[1,0],[0,1]].forEach(([a,b])=>px(fx+a,fy+b,pc)); px(fx,fy,"#f7e65a"); } }
  if(kind==="leaves"){ for(let y=0;y<16;y++)for(let x=0;x<16;x++)px(x,y,r()<.12?"#1b3f10":pick(["#2f6b1a","#3a7f22","#24561a","#468f2b"])); }
  if(kind==="cobble"){ for(let y=0;y<16;y++)for(let x=0;x<16;x++)px(x,y,pick(["#7b7b7b","#929292","#868686","#a2a2a2"]));
    for(let k=0;k<26;k++){const x=Math.floor(r()*16),y=Math.floor(r()*16);px(x,y,"#555");px((x+1)%16,y,"#5f5f5f");} }
  if(kind==="log"){ for(let y=0;y<16;y++)for(let x=0;x<16;x++){const d=Math.max(Math.abs(x-7.5),Math.abs(y-7.5)); px(x,y,d>6.5?"#5e4426":(Math.floor(d)%2?"#b08a52":"#9a7442"));} }
  if(kind==="planks"){ for(let y=0;y<16;y++)for(let x=0;x<16;x++)px(x,y,y%4===3?"#6b5130":pick(["#b8945a","#a9854f","#c09c62"])); }
  if(kind==="diamond"){ const m=["......XX......","....XXccXX....","..XXcwwccdXX..",".XcwwcccccdX..","XcwcccccccddX.",".XcccccccddX..","..XcccccddX...","...XcccddX....","....XcddX.....",".....XdX......","......X......."];
    const col={X:"#0d3a3a",c:"#4ee2d6",w:"#d7fff9",d:"#1fa59a"}; m.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(col[ch]) px(x+1,y+2,col[ch]); })); }
  return c;
}
const TEX={}; function tex(k,seed){ const id=k+(seed||""); return TEX[id]||(TEX[id]=texture(k,seed)); }
function heroCanvas(c,back){
  const g=c.getContext("2d"); g.clearRect(0,0,8,14);
  const H="#4a2f1b",S="#c58c5c",W="#fff",B="#3c50a0",M="#8a4c3c",T="#2fa3a8",P="#3b3fa8",K="#6b6b6b";
  const front=["HHHHHHHH","HHHHHHHH","HSSSSSSH","SSSSSSSS","SWBSSBWS","SSSMMSSS","SSMSSMSS","SSMMMMSS"];
  const backH=["HHHHHHHH","HHHHHHHH","HHHHHHHH","HHHHHHHH","HHHHHHHH","HHHHHHHH","HHHHHHHH","SSHHHHSS"];
  const body=["STTTTTTS","STTTTTTS","STTTTTTS","SPPPPPPS".replace(/S/g,"P"),"PPPPPPPP","KKK..KKK"];
  const col={H,S,W,B,M,T,P,K};
  (back?backH:front).concat(body).forEach((row,y)=>[...row].forEach((ch,x)=>{ if(col[ch]){g.fillStyle=col[ch];g.fillRect(x,y,1,1);} }));
}
let S=null;
function initScene(){
  const map=[];
  for(let y=0;y<ROWS;y++){ map.push([]); for(let x=0;x<COLS;x++) map[y].push({k:"grass",s:1+((x*7+y*13)%5)}); }
  [[1,1],[2,1],[1,2],[10,0],[11,0],[11,1],[9,5],[10,5]].forEach(([x,y])=>map[y][x]={k:"leaves",s:x+y});
  [[2,0],[11,5]].forEach(([x,y])=>map[y][x]={k:"log",s:3});
  [[6,1],[7,1],[7,2]].forEach(([x,y])=>map[y][x]={k:"cobble",s:x*3+y});
  [[4,4],[8,4],[3,2],[9,3],[5,0]].forEach(([x,y],i)=>map[y][x]={k:"flower",s:20+i});
  S={map,x:4,y:2,dir:[0,1],gems:[[2,4],[9,2],[5,5]],count:{cobble:5,diamond:0},used:new Set(),chat:"",lines:[]};
  heroCanvas($("heroc"),false);
  $("inv").innerHTML=["cobble","grass","log","leaves","planks","flower","diamond","cobble","planks"].concat(Array(18).fill("")).map(k=>'<div>'+(k?'<img src="'+tex(k,9).toDataURL()+'">':'')+'</div>').join("");
  const world=$("world");
  world.addEventListener("contextmenu",e=>e.preventDefault());
  world.addEventListener("mousedown",e=>{
    const r=world.getBoundingClientRect(); const cx=Math.floor((e.clientX-r.left)/r.width*COLS), cy=Math.floor((e.clientY-r.top)/r.height*ROWS);
    let tx=S.x+S.dir[0], ty=S.y+S.dir[1];
    if(Math.abs(cx-S.x)<=1 && Math.abs(cy-S.y)<=1 && !(cx===S.x&&cy===S.y)){ tx=cx; ty=cy; S.dir=[Math.sign(cx-S.x),Math.sign(cy-S.y)]; }
    if(tx<0||ty<0||tx>=COLS||ty>=ROWS) return;
    const t=S.map[ty][tx];
    if(e.button===2){ if(t.k==="grass"||t.k==="flower"){ S.map[ty][tx]={k:"cobble",s:tx+ty}; S.count.cobble=Math.max(0,S.count.cobble-1); drawScene(); if(SC===1&&ST===2) win(); } }
    if(e.button===0){ if(t.k==="cobble"||t.k==="leaves"||t.k==="log"){ const c=document.createElement("div"); c.className="crack"; c.style.left=(tx*100/COLS)+"%"; c.style.top=(ty*100/ROWS)+"%"; world.appendChild(c);
        setTimeout(()=>{ c.remove(); S.map[ty][tx]={k:"grass",s:2}; if(t.k==="cobble") S.count.cobble++; drawScene(); if(SC===1&&ST===3) win(); },350); } }
    drawScene();
  });
  drawScene();
}
function drawScene(){
  if(!S||!$("mapc")) return;
  const g=$("mapc").getContext("2d"); g.imageSmoothingEnabled=false;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ const t=S.map[y][x]; g.drawImage(tex(t.k,t.s),x*16,y*16); }
  const h=$("hero"); h.style.left=(S.x*100/COLS)+"%"; h.style.top=((S.y+1)*100/ROWS-100/ROWS*1.7)+"%";
  heroCanvas($("heroc"), S.dir[1]<0);
  const sel=$("sel"), tx=S.x+S.dir[0], ty=S.y+S.dir[1];
  sel.style.display=(tx<0||ty<0||tx>=COLS||ty>=ROWS)?"none":""; sel.style.left=(tx*100/COLS)+"%"; sel.style.top=(ty*100/ROWS)+"%";
  sel.classList.toggle("pulse", SC===1&&(ST===2||ST===3));
  document.querySelectorAll("#world .gem").forEach(e=>e.remove());
  S.gems.forEach(([x,y])=>{ const d=document.createElement("div"); d.className="gem"; d.style.left=(x*100/COLS)+"%"; d.style.top=(y*100/ROWS)+"%"; d.innerHTML='<img src="'+tex("diamond").toDataURL()+'">'; $("world").insertBefore(d,$("hero")); });
  const items=["cobble","grass","log","planks","flower","","","","diamond"];
  $("bar").innerHTML=items.map((k,i)=>'<div class="slot'+(i===0?" on":"")+'">'+(k?'<img src="'+tex(k,9).toDataURL()+'">':'')+(k==="cobble"?'<b>'+S.count.cobble+'</b>':'')+(k==="diamond"&&S.count.diamond?'<b>'+S.count.diamond+'</b>':'')+'</div>').join("");
}
function free(x,y){ if(x<0||y<0||x>=COLS||y>=ROWS) return false; const k=S.map[y][x].k; return k==="grass"||k==="flower"; }
function say(t){ const l=$("log"); const d=document.createElement("div"); d.textContent=t; l.appendChild(d); while(l.children.length>3) l.firstChild.remove(); setTimeout(()=>d.remove(),5000); }
function sceneKey(e){
  if(!S||!$("mc")) return;
  const c=e.code, inv=$("inv"), chat=$("chat");
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Tab","Slash","KeyT","Enter"].includes(c)) e.preventDefault();
  if(chat.classList.contains("show")){
    if(c==="Escape"){ chat.classList.remove("show"); S.chat=""; if(SC===1&&ST===6) win(); return; }
    if(c==="Enter"){ if(S.chat.trim()) say("<"+(LANG==="ru"?"Крафтер":"Crafter")+"> "+S.chat); chat.classList.remove("show"); S.chat=""; return; }
    if(c==="Backspace"){ S.chat=S.chat.slice(0,-1); }
    else if(e.key.length===1){ S.chat+=e.key; e.preventDefault(); }
    chat.textContent=S.chat; return;
  }
  if(inv.classList.contains("show")){
    if(c==="KeyE"||c==="Escape"){ inv.classList.remove("show"); if(c==="Escape"&&SC===1&&ST===6) win(); return; }
    if(c==="KeyT"){ inv.classList.remove("show"); } else return;
  }
  const mv={KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]}[c];
  if(mv){ S.dir=mv; const nx=S.x+mv[0], ny=S.y+mv[1]; if(free(nx,ny)){S.x=nx;S.y=ny;}
    const gi=S.gems.findIndex(([x,y])=>x===S.x&&y===S.y); if(gi>=0){ S.gems.splice(gi,1); S.count.diamond++; ding(); }
    drawScene();
    if(SC===1&&ST===0){ S.used.add(c); document.querySelectorAll('.bk[data-code="'+c+'"]').forEach(b=>b.classList.add("used")); if(S.used.size===4) win(); }
    return; }
  if(c==="Space"){ const h=$("hero"); h.classList.add("jump"); setTimeout(()=>h.classList.remove("jump"),260); if(SC===1&&ST===1) win(); return; }
  if(c==="KeyE"){ inv.classList.add("show"); if(SC===1&&ST===4) win(); return; }
  if(c==="KeyT"){ chat.textContent=""; chat.classList.add("show"); if(SC===1&&ST===5) win(); return; }
  if(c==="Escape"){ if(SC===1&&ST===6) win(); return; }
}

/* keys */
function bigDown(code,on){ document.querySelectorAll('.bk[data-code="'+code+'"]').forEach(b=>b.classList.toggle("real",on)); }
document.addEventListener("keydown",e=>{
  if(e.code==="F5"||e.key==="Alt") e.preventDefault();
  down.add(e.code); bigDown(e.code,true); paintMap();
  const st=cur(); if(!st) return;
  if(SC===1){ sceneKey(e); return; }
  if(st.tap && st.tap.includes(e.code)) win();
  if(st.combo && e.code===st.combo[1] && (down.has(st.combo[0])||(st.combo[0]==="ControlLeft"&&e.ctrlKey)||(st.combo[0]==="MetaLeft"&&e.metaKey)||(st.combo[0]==="AltLeft"&&e.altKey))){
    if(SC===0&&ST===1) win();
    if(SC===0&&ST===3) setTimeout(()=>{const b=$("box"); if(b&&b.value.trim()) win();},60);
  }
});
document.addEventListener("keyup",e=>{ if(e.key==="Alt") e.preventDefault(); down.delete(e.code); bigDown(e.code,false); paintMap(); });
function checkSelect(){ if(SC!==0||ST!==0) return; const t=String(document.getSelection()).replace(/\s+/g," ").trim(); if(t.length>=CMD.length-2 && CMD.includes(t)) win(); }
document.addEventListener("mouseup",()=>setTimeout(checkSelect,0));
document.addEventListener("keyup",e=>{ if(e.shiftKey||e.key==="Shift") setTimeout(checkSelect,0); });
window.addEventListener("blur",()=>{ down.clear(); document.querySelectorAll(".bk.real").forEach(b=>b.classList.remove("real")); paintMap(); });

/* controls */
const START={copy:0,game:1}[(q.get("t")||"").toLowerCase()];
$("scrOS").addEventListener("click",e=>{const t=e.target.closest(".tile"); if(!t) return; OS=t.dataset.os; buildKB();
  if(START!==undefined && SC<0 && !window.__started){ window.__started=true; SC=START; ST=0; pk=""; render(); } else topics();});
$("toOS").addEventListener("click",()=>{ SC=-1; show("scrOS"); });
$("topics").addEventListener("click",e=>{const t=e.target.closest(".tile"); if(!t) return; SC=+t.dataset.i; ST=0; pk=""; render();});
$("toTopics").addEventListener("click",topics);
$("langBtn").addEventListener("click",()=>$("langPanel").classList.add("show"));
$("langPanel").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setLang(b.dataset.l); $("langPanel").classList.remove("show"); });
setLang(LANG); show("scrOS");
$("prev").addEventListener("click",()=>{ if(ST>0){ST--;pk="";render();} else topics(); });
$("next").addEventListener("click",next);
})();
</script>
